[pytest]
# Pytest configuration for AnyhowMoomoo trading daemon

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Markers for categorizing tests
markers =
    integration: marks tests that require external services (OpenD, etc)
    unit: marks unit tests that can run standalone
    slow: marks tests that take a long time to run

# Command line options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Minimum Python version
minversion = 3.10
